name: Validate and Deploy Perth Planner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Static Site and Infrastructure
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install infrastructure validation dependencies
        run: npm ci --prefix infra
      - name: Check application JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
      - name: Install Chromium
        id: chromium
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: latest
          install-dependencies: true
      - name: Test PWA and offline behavior
        timeout-minutes: 2
        env:
          PWA_BROWSER: ${{ steps.chromium.outputs.chrome-path }}
        run: node scripts/check-pwa.cjs
      - name: Test infrastructure, workflow, and release packaging
        run: npm test --prefix infra
      - name: Synthesize without AWS access (test account only)
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
          AWS_REGION: ap-south-1
        run: npx cdk synth --no-lookups --quiet
      - name: Package production files
        run: node scripts/package-site.cjs
      - name: Upload validated release artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-site-${{ github.sha }}
          path: .deployment/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy Production
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: perth-planner-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check required non-secret configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in AWS_REGION S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID CLOUDFRONT_URL AWS_ROLE_ARN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing GitHub repository variable: $variable"
              exit 1
            fi
          done
      - name: Download validated release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-site-${{ github.sha }}
          path: .deployment/
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: perth-planner-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Upload, invalidate, and verify production
        run: node scripts/deploy-site.cjs